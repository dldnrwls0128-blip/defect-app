<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a1f1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="하자관리" />
  <title>하자관리</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button type="button" id="btn-back" hidden aria-label="뒤로">‹</button>
      <h1 id="header-title">하자관리</h1>
      <span class="hdr-spacer"></span>
    </header>
    <main id="view"></main>
    <nav class="tab-bar" aria-label="하단 메뉴">
      <a class="tab-item" data-tab="home" href="#/home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9H4v-9z"/><path d="M10 20v-6h4v6"/></svg>홈</a>
      <a class="tab-item" data-tab="list" href="#/list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>조회</a>
      <a class="tab-item" data-tab="dash" href="#/dash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>현황</a>
      <a class="tab-item" data-tab="vendor" href="#/vendor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM8.5 12l2 2 4-4M8.5 17h7"/></svg>업체</a>
      <a class="tab-item" data-tab="settings" href="#/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.7 7.7 0 0 0 .1-6l-2.1-.3a6 6 0 0 0-1.3-2.2l.9-1.9-2.5-1.5-1.2 1.8a6 6 0 0 0-2.6 0L9.5 3.1 7 4.6l.9 1.9A6 6 0 0 0 6.6 8.7L4.5 9a7.7 7.7 0 0 0 .1 6l2.1.3a6 6 0 0 0 1.3 2.2l-.9 1.9 2.5 1.5 1.2-1.8a6 6 0 0 0 2.6 0l1.2 1.8 2.5-1.5-.9-1.9a6 6 0 0 0 1.3-2.2l2.1-.3z"/></svg>설정</a>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="busy" hidden><div class="busy-card"><div class="spinner"></div><div id="busy-text">처리 중…</div></div></div>
  <input id="input-xlsx" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
  <input id="input-backup" type="file" accept="application/zip,.zip" />
  <input id="input-camera" type="file" accept="image/*" capture="environment" />
  <input id="input-album" type="file" accept="image/*" multiple />
  <script src="./vendor/jszip/jszip.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
